highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
environment: prod
url: "https://takae-underscore.github.io"  # Sitemap base URL.
incremental: false
plugins:
  - jekyll-scholar
  - jekyll-sitemap
  - jekyll-feed
  - jektex
exclude: [".jektex-cache/"]
jektex:
  cache_dir: ".jektex-cache"
  ignore: ["*.xml"]
  silent: false
  katex_options:
    trust: false
  macros:
    - ["\\R", "\\mathbb{R}"]
    - ["\\Q", "\\mathbb{Q}"]
    - ["\\C", "\\mathbb{C}"]